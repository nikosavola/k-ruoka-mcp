# Publishes rustdoc for the library to GitHub Pages on push to main.
name: docs

on:
  push:
    branches: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Own group, not shared with deploy's: GitHub cancels a group's pending run
    # outright when a third arrives, so a shared group would let a PR evict a queued
    # main deploy rather than just race it.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # --lib: probe/spike are dev-only, excluded here for the same reason they are
      # excluded from the published crate.
      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --lib --locked

      # cargo doc has no landing page for a single crate; it writes straight into
      # <crate-name>/.
      - name: Redirect the site root to the crate
        run: |
          {
            echo '<!DOCTYPE html>'
            echo '<meta charset="utf-8">'
            echo '<title>k-ruoka-mcp</title>'
            echo '<meta http-equiv="refresh" content="0; url=k_ruoka_mcp/index.html">'
            echo '<a href="k_ruoka_mcp/index.html">k_ruoka_mcp</a>'
          } > target/doc/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Explicit allowlist, not just an exclusion: a workflow_dispatch on a feature
    # branch must never publish it as the live site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

# Tests, coverage and lint on every push and pull request.
#
# Only the hermetic suite runs here. The live suites need network, Chrome and -- for the
# account one -- a real K-Plussa login, so they are `#[ignore]`d and stay a local thing.
# That is also why coverage sits around 70% rather than higher: see the note in the
# justfile.
#
# Lint also runs here: git hooks alone miss anyone who skipped `prek install`, including
# the zizmor audit that guards the release pipeline's `id-token: write`.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coverage needs cargo-llvm-cov, which is easiest to keep on one OS. Cross-platform
  # correctness (the `cross-platform` job below) does not need it: the hermetic suite
  # launches no browser, so it is a fair test of the portability code paths without
  # needing Chrome or a coverage toolchain on every runner.
  coverage:
    name: Test and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/upload-code-coverage attaches the report to the run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keys on Cargo.lock, so this only rebuilds when the dependency tree actually changes.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # release.yml publishes with `cargo publish --locked` and checks this itself before
      # tagging. Here it is for feedback on the pull request instead of at release time.
      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # `just` so the coverage flags live in exactly one place. Duplicating them here is
      # how a local number and a CI number quietly stop matching.
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-llvm-cov,just

      - name: Test with coverage
        run: just coverage-xml

      - name: Summary
        run: just coverage

      # Both uploads only read the coverage.xml the step above already wrote, and go to
      # two unrelated services -- nothing here needs the other to finish first.
      - parallel:
          - name: Upload code coverage to Codecov
            uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
            with:
              token: ${{ secrets.CODECOV_TOKEN }}
              # A Codecov hiccup is not a reason to fail a run whose tests and coverage
              # both passed, same reasoning as the GitHub upload's fail-on-error below.
              fail_ci_if_error: false

          - name: Upload code coverage to GitHub
            uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
            with:
              file: coverage.xml
              language: Rust
              label: code-coverage/cargo-llvm-cov
              # The upload 404s until the repository has GitHub's code-coverage feature
              # enabled, and a reporting side-channel being unavailable is not a reason to
              # fail a run whose tests and coverage both passed. The `just coverage` step
              # above still enforces the floor, so a real regression is caught either way.
              fail-on-error: false

  # Chrome discovery, the UA platform token, profile locations and signal handling all
  # branch per OS. This is the only thing that can actually catch a platform-specific
  # regression short of running the live suite by hand on each OS, since none of those
  # branches launch a browser -- `cfg!(target_os = ...)` picks the value at compile time,
  # so a Windows or macOS build failure or a wrong constant shows up here.
  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # shared-key needs the OS too, or the three matrix jobs fight over one cache slot.
          shared-key: cross-platform-${{ matrix.os }}
      - run: cargo test --all-targets

  # `rust-version` in Cargo.toml is a promise to anyone running `cargo install`, and cargo
  # refuses the install on an older toolchain rather than trying. Nothing else here builds
  # on anything but the runner's latest stable, so without this the number is unfalsifiable
  # and drifts the first time a dependency raises its own floor.
  msrv:
    name: Build on the declared MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv
      # rustup rather than a toolchain action: the version is read out of Cargo.toml, so
      # there is one source of truth and no third pin to keep in step with it.
      - name: Build with the toolchain Cargo.toml declares
        run: |
          MSRV=$(grep -m 1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$MSRV" ]; then
            echo "::error::no rust-version in Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check --all-targets --locked

  # Runs the same hooks as local `prek install` (.pre-commit-config.yaml), so a PR from
  # someone without hooks installed still gets clippy, zizmor, etc. Skips cargo-test: the
  # coverage and cross-platform jobs above already run it. rustfmt/clippy ship with the
  # runner's rustup toolchain; `just` (for the just-fmt hook) doesn't, so it's installed here.
  lint:
    name: Lint (pre-commit hooks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The just-fmt hook shells out to it; rustfmt and clippy come from the runner.
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just

      # No token in this step's environment on purpose. It runs cargo-clippy, which
      # compiles the pull request's code and so executes its build scripts and proc macros.
      # The action passes --show-diff-on-failure itself, which matters because the
      # formatters rewrite in place on a runner that is then thrown away.
      - name: Run pre-commit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.11"
          extra-args: --all-files --skip cargo-test --skip zizmor

      # Separate, so the token reaches zizmor and nothing else. With it the online audits
      # resolve actions against the GitHub API instead of quietly degrading to offline.
      - name: Audit the workflows
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prek-version: "0.4.11"
          extra-args: --all-files zizmor

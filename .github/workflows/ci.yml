# Tests, coverage and lint on every push and pull request.
#
# Only the hermetic suite runs here -- the live suites need network, Chrome and a real
# login, so they stay `#[ignore]`d and local. Lint runs here too, for anyone who skipped
# `prek install` locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coverage needs cargo-llvm-cov, easiest to keep on one OS; cross-platform below covers
  # the rest without it.
  coverage:
    name: Test and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/upload-code-coverage attaches the report to the run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keys on Cargo.lock, so this only rebuilds when the dependency tree actually changes.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # For feedback on the PR; release.yml checks this again before tagging.
      - name: Check Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      # `just` so the coverage flags live in one place, not duplicated here.
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-llvm-cov,cargo-nextest,just

      - name: Test with coverage
        run: just coverage-xml

      - name: Summary
        run: just coverage

      # These only read files the two steps above already wrote, to unrelated services --
      # none needs another to finish first. A reporting hiccup shouldn't fail a run whose
      # tests and coverage passed, hence fail_ci_if_error/fail-on-error: false throughout.
      - parallel:
          - name: Upload code coverage to Codecov
            uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
            with:
              token: ${{ secrets.CODECOV_TOKEN }}
              fail_ci_if_error: false

          - name: Upload code coverage to GitHub
            uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
            with:
              file: coverage.xml
              language: Rust
              label: code-coverage/cargo-llvm-cov
              # 404s until GitHub's code-coverage feature is enabled on the repo.
              fail-on-error: false

          # Reads the JUnit report the nextest "ci" profile (nextest.toml) wrote, for
          # Codecov's flaky-test and failure-rate analytics. Runs even if tests failed --
          # that's the case this exists for -- unlike the two uploads above, which have
          # nothing to read then and skip normally.
          - name: Upload test results to Codecov
            if: ${{ !cancelled() }}
            uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
            with:
              token: ${{ secrets.CODECOV_TOKEN }}
              file: target/nextest/ci/junit.xml
              fail_ci_if_error: false

  # Chrome discovery, the UA token, profile paths and signal handling all branch per OS
  # via `cfg!(target_os = ...)`; this is what catches a platform-specific regression
  # without running the live suite by hand on each OS.
  cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # shared-key needs the OS too, or the three matrix jobs fight over one cache slot.
          shared-key: cross-platform-${{ matrix.os }}
      - run: cargo test --all-targets

  # `rust-version` in Cargo.toml is a promise to `cargo install` users; nothing else here
  # builds on anything but the runner's latest stable, so without this the number drifts.
  msrv:
    name: Build on the declared MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: msrv
      # rustup rather than a toolchain action: the version is read out of Cargo.toml, so
      # there is one source of truth and no third pin to keep in step with it.
      - name: Build with the toolchain Cargo.toml declares
        run: |
          MSRV=$(grep -m 1 '^rust-version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$MSRV" ]; then
            echo "::error::no rust-version in Cargo.toml"
            exit 1
          fi
          echo "Declared MSRV: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check --all-targets --locked

  # Same hooks as local `prek install`, for PRs from anyone who skipped it. Skips
  # cargo-test since coverage/cross-platform already run it.
  lint:
    name: Lint (pre-commit hooks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The just-fmt hook shells out to it; rustfmt and clippy come from the runner.
      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: just

      # No token here on purpose: this compiles the PR's code, running its build scripts
      # and proc macros.
      - name: Run pre-commit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.11"
          extra-args: --all-files --skip cargo-test --skip zizmor

      # Separate step, so the token reaches only zizmor and lets it query the GitHub API.
      - name: Audit the workflows
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prek-version: "0.4.11"
          extra-args: --all-files zizmor

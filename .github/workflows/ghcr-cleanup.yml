# The amd64/arm64 children of a tagged manifest list are themselves untagged by design.
# ghcr-cleanup-action walks manifest lists first and excludes their children before
# deleting untagged versions, so a naive delete-untagged wouldn't orphan `latest`.
# Verified against its source at the pinned commit, not just the README.
name: ghcr-cleanup

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

# Not safe to run twice concurrently; queue instead of cancelling mid-delete.
concurrency:
  group: ghcr-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup
    # Guards dispatch only: a branch could loosen retention and self-arm before review.
    # schedule already runs on the default branch, so it needs no such guard.
    if: >-
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          exclude-tags: latest
          keep-n-tagged: 10
          delete-untagged: true
          validate: true
          # Ships dry-run deliberately: flip to false once a run's log matches expectations.
          dry-run: true

# Builds the Docker image and pushes it to GHCR (ghcr.io) only. Deliberately not Docker
# Hub: GHCR authenticates with GITHUB_TOKEN, so there is no separate account or secret to
# manage, and the image lives next to the code as a repository package.
#
# Each architecture is built on a runner of that architecture, then the two are joined
# into one manifest list. The obvious alternative, one job emulating arm64 through QEMU,
# does work but has to compile the whole Rust dependency tree under emulation: the first
# attempt was cancelled after 25 minutes still inside `cargo build`. `ubuntu-24.04-arm`
# runners are free for public repositories, and `build.yml` already uses one for the
# aarch64 wheel, so there is nothing to emulate.
#
# A fork PR can't push to GHCR, so PR builds load the image into the runner's own
# daemon and smoke test that instead of the registry.
name: docker

on:
  push:
    branches: [main]
    # Everything that ends up inside the image, entrypoint included. A push touching
    # only docs or tests does not change the image, so it does not rebuild it.
    paths:
      - docker/Dockerfile
      - docker/Dockerfile.dockerignore
      - docker/docker-entrypoint.sh
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/docker.yml
      - .github/workflows/docker_smoke_test.py
  pull_request:
    paths:
      - docker/Dockerfile
      - docker/Dockerfile.dockerignore
      - docker/docker-entrypoint.sh
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/docker.yml
      - .github/workflows/docker_smoke_test.py
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Spelled out rather than composed from REGISTRY, since one env entry cannot reference
  # another. Abbreviated because the `outputs:` line below is a comma-separated list that
  # cannot be wrapped: any wrap inserts a space, which buildx reads as part of a key.
  IMG: ghcr.io/${{ github.repository }}

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests build and smoke only, in a job holding no registry credential. A
  # same-repository PR's token is not downgraded the way a fork's is, so a job with
  # packages: write would let a PR touch the published package before review.
  build-pr:
    name: build PR (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Reads the shared cache but never writes it: a PR's own entries would evict what
      # the push path relies on and can never help it.
      - name: Build and load
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          tags: k-ruoka-mcp:pr-smoke-${{ matrix.arch }}
          outputs: type=docker
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Smoke test the image on this architecture
        env:
          IMAGE: k-ruoka-mcp:pr-smoke-${{ matrix.arch }}
        run: python3 .github/workflows/docker_smoke_test.py "$IMAGE"

  build:
    name: build (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      # Reported separately: knowing arm64 broke while amd64 built is the point of the split.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag rules as the merge job, though nothing here is tagged: they decide the
      # org.opencontainers.image.version label, which otherwise falls back to the branch.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMG }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Pushed by digest, with no tag: a tag here would be claimed by whichever
      # architecture finished last. The merge job tags the list naming both.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMG }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture, or the two jobs evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Proves the pushed bytes run, not just what buildx built locally.
      - name: Pull the image back by digest
        env:
          IMAGE: ${{ env.IMG }}@${{ steps.build.outputs.digest }}
        run: docker pull "$IMAGE"

      # Failing here blocks merge (needs: build), so a broken image never gets tagged.
      - name: Smoke test the image on this architecture
        env:
          IMAGE: ${{ env.IMG }}@${{ steps.build.outputs.digest }}
        run: python3 .github/workflows/docker_smoke_test.py "$IMAGE"

      # An empty file named after the digest carries it with no parsing on the other side.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          # A re-run keeps the previous attempt's artifacts and uploading the same name
          # twice is an error, so "Re-run all jobs" would fail here.
          overwrite: true

  merge:
    name: Join the architectures
    needs: build
    # A PR build never pushes, so there's nothing to join.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMG }}
          tags: |
            # Only from the default branch. workflow_dispatch runs on any ref, and an
            # ungated `latest` let a dispatch on a branch quietly replace the image the
            # README tells people to pull.
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # The tags come out of metadata-action's own JSON rather than being rebuilt here, so
      # the two cannot drift.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # word splitting is how the arguments are formed
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMG}@sha256:%s " *)

      - name: Show what was published
        env:
          # The tag this run actually created, not `latest`: that one is only published
          # from the default branch, so inspecting it after a branch dispatch would report
          # some earlier image and prove nothing about this run.
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "${IMG}:${VERSION}"

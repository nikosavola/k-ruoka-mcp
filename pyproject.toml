# PyPI is used purely as a distribution channel for the Rust binary. There is no Python
# API, no PyO3, and no Python in the wheel -- maturin's `bin` bindings compile the crate
# and drop the executable into the wheel's scripts directory, which is what puts it on
# PATH inside the environment uvx creates.
#
# The payoff is the client config: no cargo, no manual download from GitHub Releases, no
# PATH fiddling.
#
#     {"command": "uvx", "args": ["k-ruoka-mcp"]}
#
# That invocation passes no subcommand, which is why `serve` is the default one.
#
# NOTE: this does not remove the Chrome dependency. The server drives a real browser over
# CDP (there is no public K-Ruoka API), so Google Chrome still has to be present. A wheel
# cannot ship a browser.

[project]
name = "k-ruoka-mcp"
description = "MCP server for managing a K-Ruoka shopping cart for one K-Plussa account"
readme = "README.md"
# uv only needs an interpreter to build the environment it runs the binary in; nothing
# here executes Python. The floor is therefore about what uv supports, not about us.
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Niko Savola" }]
keywords = [
  "cart",
  "groceries",
  "k-plussa",
  "k-ruoka",
  "kesko",
  "mcp",
  "model-context-protocol",
  "shopping",
]
# No "Programming Language :: Python :: 3.x" entries on purpose: the wheel is tagged
# `py3-none-<platform>` and contains no Python, so claiming per-version support would be
# misleading. The OS list is real, though -- these are the platforms wheels are built for.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Natural Language :: Finnish",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Rust",
  "Topic :: Internet",
  "Topic :: Utilities",
]
# Read from Cargo.toml by maturin. Declaring it here as well would be a second source of
# truth that silently drifts, and the release workflow tags off the crate version.
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/nikosavola/k-ruoka-mcp/releases"
Issues = "https://github.com/nikosavola/k-ruoka-mcp/issues"
Repository = "https://github.com/nikosavola/k-ruoka-mcp/"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.codespell]
# Only what actually trips: "unparseable" is a valid spelling that codespell dislikes.
# Add to this list when a real false positive appears rather than up front -- the Finnish
# in the notes and fixtures turns out not to bother it.
ignore-words-list = "unparseable"
skip = "./target,./dist,./Cargo.lock,./.jj,./.git,README.fi.md,README.sv.md"

[tool.maturin]
# Explicit rather than inferred: maturin only auto-detects `bin` when a crate has a
# single binary target, and this one has three.
bindings = "bin"
# Keep the repo out of the sdist where it is only development weight.
exclude = ["justfile", ".github/**"]

# Restricts the wheel to the server binary -- `spike` and `probe` are development tools
# that reproduce measurements against the live site and have no business being
# published. Verified by unzipping the wheel, since the docs do not spell this out.
[[tool.maturin.targets]]
name = "k-ruoka-mcp"
bindings = "bin"

# --- Python tooling ------------------------------------------------------------------
#
# The only Python here is three test harnesses (`tests/*.py`, `.github/workflows/
# smoke_test.py`). They speak MCP over stdio properly rather than calling Rust functions,
# which is the point of them -- but they are still scripts, so the lint config below is
# tuned for scripts rather than for a library.

[tool.ruff]
fix = true
preview = true
# Match the Rust side, which `cargo fmt` keeps at 100.
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",  # flake8-builtins
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",  # pycodestyle errors
  "ERA",  # eradicate
  "F",  # pyflakes
  "FLY",  # flynt
  "FURB",  # refurb
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "N",  # pep8-naming
  "PERF",  # perflint
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",  # flake8-bandit
  "SIM",  # flake8-simplify
  "T10",  # flake8-debugger
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
ignore = [
  "E501",  # line length is the formatter's job
  "RUF001",  # Finnish product names and the box-drawing in `login`'s banner
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# These are console harnesses, not library code. Spawning the server binary is the entire
# point of them (S404/S603/S607), printing IS their output (T20), `SystemExit("why")` is
# the right shape for a script (TRY003), and the scratch profile paths under /tmp are
# deliberate and documented (S108).
"tests/*.py" = [
  "PLR2004",
  "S101",
  "S108",
  "S404",
  "S603",
  "S607",
  "T20",
  "TRY003"
]
".github/workflows/smoke_test.py" = [
  "PLR2004",
  "S101",
  "S404",
  "S603",
  "S607",
  "T20",
  "TRY003",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

[tool.tombi.schema]
strict = false

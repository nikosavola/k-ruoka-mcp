[package]
name = "k-ruoka-mcp"
version = "0.1.1"
edition = "2024"
description = "MCP server for managing a K-Ruoka shopping cart for one K-Plussa account"
repository = "https://github.com/nikosavola/k-ruoka-mcp"
license = "Apache-2.0"
# The wheel ships this binary and only this one. `spike` and `probe` are development
# tools that reproduce measurements against the live site; they stay in the
# repo and out of the distribution.
default-run = "k-ruoka-mcp"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
chromiumoxide = "0.9"
clap = { version = "4.6.4", features = ["derive"] }
futures = "0.3.33"
rmcp = { version = "3", features = [
  "macros",
  "schemars",
  "server",
  "transport-io"
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rmcp = { version = "3", features = ["client"] }

# Only for signalling a login child's whole process group: Chrome is a grandchild, so
# killing just the child leaves it holding the profile lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Drops the symbol table only (release has no DWARF anyway), at the cost of function
# names in a backtrace. 15.7 MB to 10.6 MB.
[profile.release]
strip = true

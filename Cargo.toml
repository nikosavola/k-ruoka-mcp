[package]
name = "k-ruoka-mcp"
version = "0.1.3"
edition = "2024"
# The dependency floor, not a guess: the locked tree declares 1.88 (darling, rmcp), and
# `cargo +1.88 check --all-targets --locked` passes. ci.yml holds it to that, otherwise the
# number would rot the first time a dependency moved. Edition 2024 alone would only need
# 1.85.
rust-version = "1.88"
description = "MCP server for managing a K-Ruoka shopping cart for one K-Plussa account"
# Left at the README rather than defaulting to docs.rs. `src/lib.rs` is public only so the
# integration tests can reach it; docs.rs would publish that as though it were an API to
# program against, and there is nothing here to call from Rust.
documentation = "https://github.com/nikosavola/k-ruoka-mcp#readme"
# Explicit because three READMEs sit next to each other; only the English one ships.
readme = "README.md"
repository = "https://github.com/nikosavola/k-ruoka-mcp"
license = "Apache-2.0"
# crates.io caps this at five, so it is a subset of the eight in pyproject.toml.
keywords = ["cart", "groceries", "k-ruoka", "kesko", "mcp"]
# `api-bindings` is not a stretch despite this shipping as an executable -- the category is
# documented as including HTTP API wrappers, and wrapping `/kr-api/` is what the crate does.
categories = ["api-bindings", "command-line-utilities"]
# `cargo install` installs every bin target, and `default-run` below does not change that,
# so without this a user of the crate would get the `spike` and `probe` development tools
# on their PATH under those generic names. Excluding the sources is also what makes the
# published manifest declare one binary: cargo writes explicit `[[bin]]` tables when it
# normalises, and `cargo binstall` abandons the release archive if a binary in that list is
# missing, which would silently turn a download back into a source build.
#
# The rest is development weight that a crate consumer has no use for, trimmed for the same
# reason `[tool.maturin] exclude` trims the sdist. pyproject.toml stays: maturin honours
# this list when it builds the sdist, and without it that sdist has no build backend.
exclude = ["/.github", "/docker", "/justfile", "/src/bin", "/tests/*.py"]
# The wheel ships this binary and only this one. `spike` and `probe` are development
# tools that reproduce measurements against the live site; they stay in the
# repo and out of the distribution.
default-run = "k-ruoka-mcp"

# Where `cargo binstall k-ruoka-mcp` looks: it resolves the crate through crates.io, then
# fetches an archive off the GitHub release. Every key here overrides a default that
# `.github/workflows/repackage_wheel.py` does not produce -- a version in the filename, and
# a `<name>-<target>-v<version>/` directory inside the archive. The suffix is written out
# rather than templated through `{ archive-suffix }` because `tgz` renders that as `.tgz`
# first and `.tar.gz` only as a fallback.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
chromiumoxide = "0.9"
clap = { version = "4.6.4", features = ["derive"] }
futures = "0.3.33"
rmcp = { version = "3", features = [
  "macros",
  "schemars",
  "server",
  "transport-io"
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
rmcp = { version = "3", features = ["client"] }

# Only for signalling a login child's whole process group: Chrome is a grandchild, so
# killing just the child leaves it holding the profile lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Drops the symbol table only (release has no DWARF anyway), at the cost of function
# names in a backtrace. 15.7 MB to 10.6 MB.
[profile.release]
strip = true
